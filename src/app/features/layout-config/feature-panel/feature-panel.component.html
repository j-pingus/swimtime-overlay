@if (feature(); as f) {
  <div class="panel">
    <h2>{{ f.type === 'image' ? 'Image feature' : 'Feature' }}</h2>

    <div class="field">
      <label>Label</label>
      <input type="text" [value]="f.label" (change)="patch({ label: $any($event.target).value })" />
    </div>

    <h3>Position</h3>

    <div class="field-row">
      <div class="field">
        <label>X</label>
        <input type="number" [value]="f.x" min="0"
          (change)="patch({ x: asNumber($any($event.target).value) })" />
      </div>
      <div class="field">
        <label>Y</label>
        <input type="number" [value]="f.y" min="0"
          (change)="patch({ y: asNumber($any($event.target).value) })" />
      </div>
    </div>

    <h3>Size</h3>

    <div class="field-row">
      <div class="field">
        <label>W</label>
        <input type="number" [value]="f.width" min="1"
          (change)="patch({ width: asNumber($any($event.target).value) })" />
      </div>
      <div class="field">
        <label>H</label>
        <input type="number" [value]="f.height" min="1"
          (change)="patch({ height: asNumber($any($event.target).value) })" />
      </div>
    </div>

    @if (imageFeature(); as img) {
      <h3>Image</h3>

      <div class="image-preview-wrapper">
        @if (img.src) {
          <img class="image-preview" [src]="img.src" alt="" />
        } @else {
          <div class="image-empty">No image selected</div>
        }
      </div>

      <div class="image-actions">
        <label class="btn-upload">
          Choose file
          <input type="file" accept="image/*" (change)="onImageSelected($event)" />
        </label>
        @if (img.src) {
          <button class="btn-clear" (click)="clearImage()">Clear</button>
        }
      </div>
    }

    <div class="actions">
      <button class="btn-remove" (click)="remove()">Delete feature</button>
    </div>
  </div>
} @else {
  <div class="empty">
    <p>Select a feature or add one to configure it.</p>
  </div>
}

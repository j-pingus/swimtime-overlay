@if (layout(); as layout) {
  <div class="layout-config-shell">

    <div class="left-panel">
      <header class="config-header">
        <a routerLink="/layouts" class="back-link">← Layouts</a>
        <h1 class="layout-name">{{ layout.name }}</h1>
        <div class="add-menu-wrapper">
          <button class="btn-add" (click)="showAddMenu.set(!showAddMenu())">+ Add feature</button>
          @if (showAddMenu()) {
            <div class="add-menu">
              <button (click)="addFeature('generic')">Generic</button>
              <button (click)="addFeature('image')">Image</button>
              <button (click)="addFeature('text')">Text</button>
              <button (click)="addFeature('rect')">Rectangle</button>
              <button (click)="addFeature('lane')">Lane text</button>
            </div>
          }
        </div>
      </header>

      <div class="zone-container">
        <app-zone
          [features]="features()"
          [selectedFeatureId]="selectedId()"
          (featureSelect)="onFeatureSelect($event)"
          (featureUpdate)="onFeatureUpdate($event)"
        />
      </div>
    </div>

    <div class="right-panel">
      <app-feature-panel
        [feature]="selectedFeature()"
        [features]="features()"
        (featureChange)="onFeatureUpdate($event)"
        (featureClone)="onFeatureClone($event)"
        (featureRemove)="onFeatureRemove($event)"
        (featureSelect)="onFeatureSelect($event)"
        (featuresReorder)="onFeaturesReorder($event)"
      />
    </div>

  </div>
} @else {
  <div class="not-found">
    <a routerLink="/layouts">← Back to layouts</a>
    <p>Layout not found.</p>
  </div>
}

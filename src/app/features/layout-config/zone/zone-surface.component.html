<svg
  #svgEl
  viewBox="0 0 1920 1080"
  preserveAspectRatio="xMidYMid meet"
  [class.is-interactive]="interactive()"
  (mousedown)="interactive() && onBgClick()"
>
  <!-- All clip paths hoisted here so <defs> is never inside a repeated element. -->
  <defs>
    @for (f of features(); track f.id) {
      @if (f.type === 'text' || f.type === 'lane' || f.type === 'chrono') {
        <clipPath [id]="'tc-' + f.id">
          <rect [attr.x]="f.x - 8" [attr.y]="f.y - 4" [attr.width]="f.width + 16" [attr.height]="f.height + 8" />
        </clipPath>
      }
    }
  </defs>

  @if (interactive()) {
    <rect width="1920" height="1080" class="canvas-bg" />
  }

  @for (f of features(); track f.id) {

    @if (asGroup(f); as g) {
      @if (interactive()) {
        @let bounds = groupBoundsMap().get(g.id);
        @if (bounds) {
          <rect
            [attr.x]="bounds.x - GROUP_PAD"
            [attr.y]="bounds.y - GROUP_PAD"
            [attr.width]="bounds.width + GROUP_PAD * 2"
            [attr.height]="bounds.height + GROUP_PAD * 2"
            [class.group-bounds]="true"
            [class.selected]="g.id === selectedFeatureId()"
            (mousedown)="onFeatClick($event, g)"
          />
          <text
            [attr.x]="bounds.x - GROUP_PAD + 4"
            [attr.y]="bounds.y - GROUP_PAD - 6"
            class="group-label"
          >{{ g.label }}</text>
          @if (g.id === selectedFeatureId()) {
            <circle
              [attr.cx]="bounds.x - GROUP_PAD"
              [attr.cy]="bounds.y - GROUP_PAD"
              [attr.r]="ANCHOR"
              class="anchor-move"
              (mousedown)="onMoveDragStart($event, g)"
            />
          }
        }
      }

    } @else {

      <g [class.selected]="interactive() && (f.id === selectedFeatureId() || (!!f.groupId && f.groupId === selectedFeatureId()))">

        @if (asImage(f); as img) {
          @if (img.src) {
            <image
              [attr.href]="img.src"
              [attr.x]="f.x" [attr.y]="f.y"
              [attr.width]="f.width" [attr.height]="f.height"
              preserveAspectRatio="xMidYMid meet"
              (mousedown)="interactive() && onFeatClick($event, f)"
            />
            @if (interactive()) {
              <!-- transparent overlay provides selection border and reliable click target -->
              <rect
                [attr.x]="f.x" [attr.y]="f.y"
                [attr.width]="f.width" [attr.height]="f.height"
                class="feature-overlay"
                (mousedown)="onFeatClick($event, f)"
              />
            }
          } @else {
            <!-- placeholder shown in config mode until an image is chosen -->
            <rect
              [attr.x]="f.x" [attr.y]="f.y"
              [attr.width]="f.width" [attr.height]="f.height"
              class="feature-rect feature-placeholder"
              (mousedown)="interactive() && onFeatClick($event, f)"
            />
          }

        } @else if (asRect(f); as r) {
          <!-- Fill covers the full bounding box -->
          <rect
            [attr.x]="r.x" [attr.y]="r.y"
            [attr.width]="r.width" [attr.height]="r.height"
            [attr.fill]="rectFill(r)"
            [attr.fill-opacity]="rectFillOpacity(r)"
            stroke="none"
            [attr.rx]="r.borderRadius"
            class="rect-visual"
            (mousedown)="interactive() && onFeatClick($event, f)"
          />
          <!-- Border drawn inset from the fill edges by padding -->
          @if (r.border) {
            <rect
              [attr.x]="r.x + r.padding"
              [attr.y]="r.y + r.padding"
              [attr.width]="r.width - 2 * r.padding"
              [attr.height]="r.height - 2 * r.padding"
              fill="none"
              [attr.stroke]="r.borderColor"
              [attr.stroke-width]="r.borderWidth"
              [attr.rx]="r.borderRadius"
              class="rect-visual"
            />
          }
          @if (interactive()) {
            <!-- selection + click overlay on the full bounding box so anchors always work -->
            <rect
              [attr.x]="f.x" [attr.y]="f.y"
              [attr.width]="f.width" [attr.height]="f.height"
              class="feature-overlay"
              (mousedown)="onFeatClick($event, f)"
            />
          }

        } @else if (asTextLike(f); as tl) {
          <g [attr.transform]="textTransform(tl)">
            <!-- Hit area + selection border (config only, hidden in render mode) -->
            <rect
              [attr.x]="f.x" [attr.y]="f.y"
              [attr.width]="f.width" [attr.height]="f.height"
              class="text-bg"
              (mousedown)="interactive() && onFeatClick($event, f)"
            />

            @if (asLane(tl); as lane) {
              <!-- One text element per lane, evenly spaced within the feature height -->
              @for (row of laneRows(lane); track $index) {
                <text
                  [attr.x]="textX(tl)"
                  [attr.y]="row.y"
                  dominant-baseline="central"
                  [attr.font-size]="tl.fontSize"
                  [attr.fill]="tl.color"
                  [attr.font-weight]="tl.bold ? 'bold' : 'normal'"
                  [attr.font-style]="tl.italic ? 'italic' : 'normal'"
                  [attr.text-anchor]="textAnchor(tl)"
                  [attr.stroke]="tl.outlineColor ?? 'none'"
                  [attr.stroke-width]="tl.outlineColor ? tl.outlineWidth : 0"
                  [attr.clip-path]="'url(#tc-' + f.id + ')'"
                  style="paint-order: stroke fill"
                  class="text-content"
                >{{ row.text }}</text>
              }
            } @else {
              <text
                [attr.x]="textX(tl)"
                [attr.y]="f.y + f.height / 2"
                dominant-baseline="central"
                [attr.font-size]="tl.fontSize"
                [attr.fill]="tl.color"
                [attr.font-weight]="tl.bold ? 'bold' : 'normal'"
                [attr.font-style]="tl.italic ? 'italic' : 'normal'"
                [attr.text-anchor]="textAnchor(tl)"
                [attr.stroke]="tl.outlineColor ?? 'none'"
                [attr.stroke-width]="tl.outlineColor ? tl.outlineWidth : 0"
                [attr.clip-path]="'url(#tc-' + f.id + ')'"
                style="paint-order: stroke fill"
                class="text-content"
                (mousedown)="interactive() && onFeatClick($event, f)"
              >{{ resolvedDisplayText(tl) }}</text>
            }
          </g>

        } @else if (asPolygon(f); as poly) {
          <polygon
            [attr.points]="polygonPointsAttr(poly)"
            [attr.fill]="poly.bgColor"
            [attr.fill-opacity]="poly.bgOpacity / 100"
            class="polygon-visual"
            (mousedown)="interactive() && onFeatClick($event, f)"
          />
          @if (interactive() && f.id === selectedFeatureId()) {
            @for (pt of poly.points; track $index) {
              <circle
                [attr.cx]="pt.x" [attr.cy]="pt.y" [attr.r]="ANCHOR"
                class="anchor-point"
                (mousedown)="onPointDragBegin($event, poly, $index)"
              />
            }
          }

        } @else if (asClock(f); as clk) {
          @let hands = clockHandLines(clk);
          <line
            [attr.x1]="hands.hour.x1"   [attr.y1]="hands.hour.y1"
            [attr.x2]="hands.hour.x2"   [attr.y2]="hands.hour.y2"
            [attr.stroke]="clk.color" [attr.stroke-width]="clk.hourHandWidth"
            stroke-linecap="round"
          />
          <line
            [attr.x1]="hands.minute.x1" [attr.y1]="hands.minute.y1"
            [attr.x2]="hands.minute.x2" [attr.y2]="hands.minute.y2"
            [attr.stroke]="clk.color" [attr.stroke-width]="clk.minuteHandWidth"
            stroke-linecap="round"
          />
          <line
            [attr.x1]="hands.second.x1" [attr.y1]="hands.second.y1"
            [attr.x2]="hands.second.x2" [attr.y2]="hands.second.y2"
            [attr.stroke]="clk.color" [attr.stroke-width]="clk.secondHandWidth"
            stroke-linecap="round"
          />
          @if (interactive()) {
            <rect
              [attr.x]="f.x" [attr.y]="f.y"
              [attr.width]="f.width" [attr.height]="f.height"
              class="feature-overlay"
              (mousedown)="onFeatClick($event, f)"
            />
          }

        } @else if (aschrono(f); as ch) {
          <rect
            [attr.x]="f.x" [attr.y]="f.y"
            [attr.width]="f.width" [attr.height]="f.height"
            class="text-bg"
            (mousedown)="interactive() && onFeatClick($event, f)"
          />
          <text
            [attr.x]="textX(ch)"
            [attr.y]="f.y + f.height / 2"
            dominant-baseline="central"
            [attr.font-size]="ch.fontSize"
            [attr.fill]="ch.color"
            [attr.font-weight]="ch.bold ? 'bold' : 'normal'"
            [attr.font-style]="ch.italic ? 'italic' : 'normal'"
            [attr.text-anchor]="textAnchor(ch)"
            [attr.stroke]="ch.outlineColor ?? 'none'"
            [attr.stroke-width]="ch.outlineColor ? ch.outlineWidth : 0"
            [attr.clip-path]="'url(#tc-' + f.id + ')'"
            style="paint-order: stroke fill"
            class="text-content"
            (mousedown)="interactive() && onFeatClick($event, f)"
          >{{ chronoText(ch) }}</text>

        } @else {
          <rect
            [attr.x]="f.x" [attr.y]="f.y"
            [attr.width]="f.width" [attr.height]="f.height"
            class="feature-rect"
            (mousedown)="interactive() && onFeatClick($event, f)"
          />
        }

        <!-- Label shown in config mode only; suppressed for text-like/rect/polygon/clock (their visuals speak for themselves) -->
        @if (!asTextLike(f) && !asRect(f) && !asPolygon(f) && !asClock(f)) {
          <text [attr.x]="f.x + 10" [attr.y]="f.y + 36" class="feature-label">
            {{ f.label }}
          </text>
        }

        <!-- Anchors only for individually-selected, non-grouped features -->
        @if (interactive() && f.id === selectedFeatureId() && !f.groupId) {
          <!-- Move anchor: top-left of bounding box -->
          <circle
            [attr.cx]="f.x" [attr.cy]="f.y" [attr.r]="ANCHOR"
            class="anchor-move"
            (mousedown)="onMoveDragStart($event, f)"
          />

          <!-- Resize anchor: hidden for polygons (points are resized individually) -->
          @if (!asPolygon(f)) {
            <circle
              [attr.cx]="f.x + f.width" [attr.cy]="f.y + f.height" [attr.r]="ANCHOR"
              class="anchor-resize"
              (mousedown)="onResizeDragStart($event, f)"
            />
          }
        }

      </g>
    }
  }
</svg>
